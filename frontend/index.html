<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PharmaPro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080d18;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:14px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0f1623}
::-webkit-scrollbar-thumb{background:#1e2d42;border-radius:3px}
select option{background:#131d2e}
:root{
  --bg:#080d18;--surface:#0e1520;--card:#131d2e;--border:#1e2d42;
  --accent:#00c896;--accent-dim:#00c89614;--accent-glow:#00c89633;
  --warn:#f59e0b;--warn-dim:#f59e0b12;
  --danger:#ef4444;--danger-dim:#ef444412;
  --info:#3b82f6;--info-dim:#3b82f612;
  --green:#10b981;--green-dim:#10b98112;
  --purple:#a855f7;--purp-dim:#a855f712;
  --text:#e2e8f0;--muted:#4a6080;--faint:#0f1825;--subtle:#111c2e;
}
/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.app-layout{display:flex;flex:1;overflow:hidden}
#sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px}
/* ── Auth screens ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 20% 50%,#00c89608,transparent 60%),radial-gradient(ellipse at 80% 20%,#3b82f608,transparent 60%),var(--bg)}
.auth-box{width:100%;max-width:420px;padding:20px}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo .logo-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#3b82f6);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
.auth-logo h1{font-size:24px;font-weight:900;color:var(--text)}
.auth-logo p{color:var(--muted);font-size:13px;margin-top:4px}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;background:var(--faint);border-radius:10px;padding:3px}
.auth-tab{flex:1;padding:9px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:all .2s}
.auth-tab.active{background:var(--card);color:var(--text);font-weight:800;box-shadow:0 2px 8px #00000044}
/* ── Sidebar ── */
.logo{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#3b82f6);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-text{font-weight:900;font-size:13px}
.logo-sub{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.user-pill{margin:8px 10px;background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px}
.user-pill .u-name{font-weight:700;color:var(--text)}
.user-pill .u-role{color:var(--accent);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
nav{padding:6px}
.nav-btn{width:100%;display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:500;font-size:13px;cursor:pointer;text-align:left;margin-bottom:2px;transition:all .15s;position:relative}
.nav-btn:hover{background:var(--faint);color:var(--text)}
.nav-btn.active{background:var(--accent-dim);color:var(--accent);font-weight:700}
.nav-icon{font-size:14px;flex-shrink:0}
.nav-badge{position:absolute;right:10px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:10px}
.nav-badge.warn{background:var(--warn);color:#080d18}
.nav-sep{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:10px 12px 4px}
.sidebar-bottom{padding:10px 12px;border-top:1px solid var(--border);margin-top:auto}
/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.section-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.gap-10{display:flex;flex-direction:column;gap:10px}
.gap-14{display:flex;flex-direction:column;gap:14px}
.gap-16{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
/* ── Stat card ── */
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}
.stat-val{font-size:22px;font-weight:900}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-top:4px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px}
.stat-glow{position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%}
/* ── Buttons ── */
.btn{padding:9px 18px;border-radius:9px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#00a884);color:#080d18;box-shadow:0 0 14px var(--accent-glow)}
.btn-primary:hover{box-shadow:0 0 22px var(--accent-glow);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger-dim);border:1px solid var(--danger)44;color:var(--danger)}
.btn-warn{background:var(--warn-dim);border:1px solid var(--warn)44;color:var(--warn)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-full{width:100%;justify-content:center}
/* ── Tags ── */
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.tag-green{background:var(--green-dim);color:var(--green);border:1px solid #10b98133}
.tag-red{background:var(--danger-dim);color:var(--danger);border:1px solid #ef444433}
.tag-amber{background:var(--warn-dim);color:var(--warn);border:1px solid #f59e0b33}
.tag-blue{background:var(--info-dim);color:var(--info);border:1px solid #3b82f633}
.tag-teal{background:var(--accent-dim);color:var(--accent);border:1px solid #00c89633}
.tag-gray{background:#4a608018;color:var(--muted);border:1px solid #4a608033}
.tag-purple{background:var(--purp-dim);color:var(--purple);border:1px solid #a855f733}
/* ── Inputs ── */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);outline:none;width:100%;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--muted)}
.select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);outline:none;width:100%;cursor:pointer}
/* ── Table ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 14px;border-bottom:1px solid #1e2d4222}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#ffffff04}
/* ── Search ── */
.search-wrap{position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{padding-left:36px}
.search-drop{position:absolute;top:100%;left:0;right:0;z-index:100;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:4px;max-height:280px;overflow-y:auto;box-shadow:0 8px 32px #00000088}
.search-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2d4222;transition:background .15s}
.search-item:hover{background:var(--faint)}
.search-item:last-child{border-bottom:none}
/* ── Alert ── */
.alert{padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.alert-warn{background:var(--warn-dim);border:1px solid #f59e0b44;color:var(--warn)}
.alert-danger{background:var(--danger-dim);border:1px solid #ef444444;color:var(--danger)}
.alert-info{background:var(--info-dim);border:1px solid #3b82f644;color:var(--info)}
.alert-success{background:var(--green-dim);border:1px solid #10b98144;color:var(--green)}
/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:#000000bb;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:18px}
/* ── Toast ── */
#toast{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;animation:slideIn .3s ease;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px #00000066}
.toast-item.success{border-color:var(--green)44;color:var(--green)}
.toast-item.error{border-color:var(--danger)44;color:var(--danger)}
.toast-item.warn{border-color:var(--warn)44;color:var(--warn)}
/* ── Qty ── */
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.qty-val{width:40px;text-align:center;background:var(--faint);border:1px solid var(--border);border-radius:7px;padding:4px 0;color:var(--accent);font-weight:800;font-size:15px;outline:none}
/* ── Toggle ── */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--subtle);transition:all .2s;user-select:none}
.toggle-row.on{background:var(--accent-dim);border-color:var(--accent)44}
.toggle-track{width:36px;height:20px;border-radius:10px;position:relative;flex-shrink:0;transition:all .25s}
.toggle-thumb{position:absolute;top:3px;width:14px;height:14px;border-radius:50%;transition:left .25s}
/* ── Bar chart ── */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:90px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent),var(--accent)88);transition:height .5s ease}
.bar-lbl{font-size:10px;color:var(--muted);font-weight:600}
/* ── Progress ── */
.progress{height:4px;background:var(--faint);border-radius:10px;overflow:hidden}
.progress-bar{height:100%;border-radius:10px;transition:width .4s;background:var(--accent)}
/* ── Strip vis ── */
.strip-vis{display:flex;gap:2px;flex-wrap:wrap}
.strip-cell{width:10px;height:16px;border-radius:2px}
/* ── Wizard ── */
.wizard-steps{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 24px}
.wstep{padding:11px 13px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.wstep.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:800}
.wstep.done{color:var(--accent)88;border-bottom-color:var(--accent)44}
/* ── Status badges ── */
.status-active{background:var(--green-dim);color:var(--green);border:1px solid var(--green)33;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.status-pending{background:var(--warn-dim);color:var(--warn);border:1px solid var(--warn)33;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.status-suspended{background:var(--danger-dim);color:var(--danger);border:1px solid var(--danger)33;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
/* ── Spinner ── */
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.loading-center{display:flex;justify-content:center;align-items:center;padding:60px;gap:12px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
</style>
</head>
<body>
<div id="toast"></div>
<div id="root"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
const APP = { token: localStorage.getItem('pp_token'), user: null, page: 'dashboard' };

// ── API ────────────────────────────────────────────────────────────────────────
const BASE = '';
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (APP.token) opts.headers['Authorization'] = 'Bearer ' + APP.token;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(BASE + '/api' + path, opts);
  if (r.status === 401) { logout(); throw new Error('Session expired'); }
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(err.detail || r.statusText);
  }
  return r.json();
}
const GET  = p    => api('GET',  p);
const POST = (p,b)=> api('POST', p, b);
const PUT  = (p,b)=> api('PUT',  p, b);

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.innerHTML = `<span>${{success:'✅',error:'❌',warn:'⚠️'}[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── Helpers ────────────────────────────────────────────────────────────────────
const fmt   = n => '₹' + Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtI  = n => '₹' + Math.round(n||0).toLocaleString('en-IN');
const today = () => new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const monthsLeft = ym => { if(!ym)return 99; const [y,m]=ym.split('-').map(Number); return (new Date(y,m-1,1)-new Date())/(1000*60*60*24*30); };
const fmtExp = ym => { if(!ym)return ''; const [y,m]=ym.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y; };
const expiryColor = ym => { const ml=monthsLeft(ym); return ml<=0?'var(--danger)':ml<=3?'var(--warn)':'var(--green)'; };
const accessDaysLeft = expiry => { if(!expiry)return null; return Math.ceil((new Date(expiry)-new Date())/(1000*60*60*24)); };

function statusBadge(s) {
  const map={active:'status-active',pending:'status-pending',suspended:'status-suspended'};
  return `<span class="${map[s]||'status-pending'}">${s}</span>`;
}
function stripVis(total, filled, color) {
  let h='<div class="strip-vis">';
  for(let i=0;i<total;i++) h+=`<div class="strip-cell" style="background:${i<filled?color:'var(--faint)'};border:1px solid ${i<filled?color+'88':'var(--border)'}"></div>`;
  return h+'</div>';
}
const toggleState = {};
function toggleField(id) {
  toggleState[id] = !toggleState[id];
  const row=document.querySelector(`[data-toggle="${id}"]`);
  if(row) row.className=`toggle-row ${toggleState[id]?'on':''}`;
  const track=document.getElementById('track-'+id);
  if(track) track.style.background=toggleState[id]?'var(--accent)':'var(--faint)';
  const thumb=document.getElementById('thumb-'+id);
  if(thumb){thumb.style.left=toggleState[id]?'19px':'3px';thumb.style.background=toggleState[id]?'#080d18':'var(--muted)';}
}
function toggleHTML(id, on, label, desc='') {
  toggleState[id]=on;
  return `<div class="toggle-row ${on?'on':''}" data-toggle="${id}" onclick="toggleField('${id}')">
    <div><div style="font-weight:700;color:var(--text);font-size:13px">${label}</div>${desc?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${desc}</div>`:''}</div>
    <div class="toggle-track" id="track-${id}" style="background:${on?'var(--accent)':'var(--faint)'}">
      <div class="toggle-thumb" id="thumb-${id}" style="left:${on?19:3}px;background:${on?'#080d18':'var(--muted)'}"></div>
    </div></div>`;
}

// ── Auth ───────────────────────────────────────────────────────────────────────
function logout() {
  APP.token=null; APP.user=null;
  localStorage.removeItem('pp_token');
  renderAuth();
}

async function boot() {
  if (!APP.token) { renderAuth(); return; }
  try {
    APP.user = await GET('/auth/me');
    if (APP.user.role === 'superadmin') renderAdminApp();
    else renderApp();
  } catch(e) { logout(); }
}

// ══════════════════════════════════════════════════════════════════════════════
// AUTH SCREENS
// ══════════════════════════════════════════════════════════════════════════════
function renderAuth(tab='login') {
  document.getElementById('root').innerHTML = `
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="logo-icon">⚕️</div>
        <h1>PharmaPro</h1>
        <p>Smart Pharmacy POS · Cloud Edition</p>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab ${tab==='login'?'active':''}" onclick="renderAuth('login')">Sign In</button>
          <button class="auth-tab ${tab==='register'?'active':''}" onclick="renderAuth('register')">Register</button>
        </div>
        ${tab==='login' ? loginForm() : registerForm()}
      </div>
    </div>
  </div>`;
}

function loginForm() { return `
  <div class="gap-14" id="login-form">
    <div class="field"><label>Email</label><input class="input" id="l-email" type="email" placeholder="your@email.com" autocomplete="email"></div>
    <div class="field"><label>Password</label>
      <div style="position:relative">
        <input class="input" id="l-pass" type="password" placeholder="Password" autocomplete="current-password">
        <button onclick="togglePw('l-pass')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px">👁</button>
      </div>
    </div>
    <div id="login-err" style="display:none" class="alert alert-danger"></div>
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">Sign In →</button>
    <div style="text-align:center;font-size:12px;color:var(--muted)">New pharmacy? <a onclick="renderAuth('register')" style="color:var(--accent);cursor:pointer">Register for access</a></div>
  </div>`; }

function registerForm() { return `
  <div class="gap-14">
    <div class="alert alert-info" style="font-size:12px">
      <span>ℹ️</span>
      <span>After registering, your account will be reviewed by the admin before you can sign in. You'll typically get access within 24 hours.</span>
    </div>
    <div class="grid-2">
      <div class="field"><label>Your Name *</label><input class="input" id="r-name" placeholder="Full name"></div>
      <div class="field"><label>Shop Name *</label><input class="input" id="r-shop" placeholder="Sri Lakshmi Medical"></div>
    </div>
    <div class="field"><label>Email *</label><input class="input" id="r-email" type="email" placeholder="shop@example.com"></div>
    <div class="field"><label>Phone</label><input class="input" id="r-phone" placeholder="9876543210"></div>
    <div class="field"><label>Password * (min 8 chars)</label>
      <div style="position:relative">
        <input class="input" id="r-pass" type="password" placeholder="Choose a strong password">
        <button onclick="togglePw('r-pass')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px">👁</button>
      </div>
    </div>
    <div id="reg-err" style="display:none" class="alert alert-danger"></div>
    <button class="btn btn-primary btn-full" id="reg-btn" onclick="doRegister()">Request Access →</button>

window.doLogin = async () => {
  const email=document.getElementById('l-email')?.value?.trim();
  const pass=document.getElementById('l-pass')?.value;
  const err=document.getElementById('login-err');
  const btn=document.getElementById('login-btn');
  if(!email||!pass){err.style.display='flex';err.textContent='Email and password required';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try {
    const res = await POST('/auth/login',{email,password:pass});
    APP.token=res.token; APP.user=res.user;
    localStorage.setItem('pp_token',res.token);
    if(res.user.role==='superadmin') renderAdminApp();
    else renderApp();
  } catch(e) {
    err.style.display='flex';err.innerHTML=`<span>❌</span><span>${e.message}</span>`;
    btn.disabled=false;btn.textContent='Sign In →';
  }
};

window.doRegister = async () => {
  const name=document.getElementById('r-name')?.value?.trim();
  const shop=document.getElementById('r-shop')?.value?.trim();
  const email=document.getElementById('r-email')?.value?.trim();

  if(pass.length<8){err.style.display='flex';err.innerHTML='<span>❌</span><span>Password must be at least 8 characters</span>';return;}
  btn.disabled=true;btn.textContent='Submitting…';
  try {

    document.getElementById('root').innerHTML=`
    <div class="auth-wrap"><div class="auth-box">

  const c=document.getElementById('content'); if(!c) return;
  c.innerHTML='<div class="loading-center"><div class="spinner"></div></div>';
  try {
    const map={
      dashboard:renderDashboard, billing:renderBilling, inventory:renderInventory,
      trays:renderTrays, stock_entry:renderStockEntry, putaway:renderPutaway,
      shelves:renderShelves, customers:renderCustomers, suppliers:renderSuppliers,
      reports:renderReports, settings:renderSettings
    };
    if(map[page]) await map[page](c);
    else c.innerHTML='<div class="card" style="margin:24px">Coming soon</div>';
  } catch(e) { c.innerHTML=`<div class="card" style="margin:24px;color:var(--danger)">Error: ${e.message}</div>`; }
}

function renderWizard() {

  const back=document.getElementById('wiz-back');
  const next=document.getElementById('wiz-next');
  if(!steps) return;
  steps.innerHTML=WSTEPS.map((s,i)=>`<div class="wstep ${i===wizardStep?'active':i<wizardStep?'done':''}">${i+1}. ${s}${i<wizardStep?' ✓':''}</div>`).join('');
  dots.innerHTML=WSTEPS.map((_,i)=>`<div style="width:${i===wizardStep?20:6}px;height:6px;border-radius:10px;background:${i===wizardStep?'var(--accent)':i<wizardStep?'var(--accent)55':'var(--faint)'};transition:all .3s"></div>`).join('');
  back.style.opacity=wizardStep===0?'.3':'1'; back.disabled=wizardStep===0;
  next.textContent=wizardStep===WSTEPS.length-2?'Launch PharmaPro 🚀':'Continue →';
  const html=[wizStep0,wizStep1,wizStep2,wizStep3,wizStep4];
  body.innerHTML=html[wizardStep]?html[wizardStep]():'';
  if(wizardStep===3){['wfefo','wtopup','wprint','wsched','wreorder'].forEach(id=>{
    const m={wfefo:'fefo',wtopup:'top_up_tray',wprint:'print_tray_label',wsched:'schedule_warning',wreorder:'low_stock_reorder'};
    toggleState[id]=wizardData[m[id]];});
  }
}

async function wizNext() {

    Object.entries(m).forEach(([tid,key])=>{wizardData[key]=toggleState[tid]||false;});
  }
  if(wizardStep===WSTEPS.length-2){
    const btn=document.getElementById('wiz-next'); btn.disabled=true; btn.textContent='Saving…';
    await POST('/config',{...wizardData, name:wizardData.name||APP.user.shop_name, owner:wizardData.owner||APP.user.name});

  wizardStep++;

}

    document.getElementById('bill-drop').style.display='none';
    document.getElementById('bill-search').value='';
    const ex=cart.findIndex(i=>i.id===id);
    if(ex>=0) cart[ex].qty++; else cart.push({...drug,qty:1});
    c.innerHTML=billHTML();};
  window.cartQty=(i,q)=>{if(q<=0)cart.splice(i,1);else cart[i].qty=q;c.innerHTML=billHTML();};
  window.cartRemove=(i)=>{cart.splice(i,1);c.innerHTML=billHTML();};
  window.billDisc=(v)=>{discount=v;c.innerHTML=billHTML();};
  window.billPay=(m)=>{payMode=m;c.innerHTML=billHTML();};
  window.billClear=()=>{cart=[];customer=null;c.innerHTML=billHTML();};
  window.billClearCust=()=>{customer=null;c.innerHTML=billHTML();};
  window.custSearch=async(q)=>{if(q.length<1){document.getElementById('cust-drop').style.display='none';return;}
    const cs=await GET('/customers?q='+encodeURIComponent(q));
    const drop=document.getElementById('cust-drop');
    drop.innerHTML=cs.map(cu=>`<div class="search-item" onclick="billSetCust(${cu.id},'${cu.name}','${cu.phone||''}',${cu.loyalty_points||0})">${cu.name} <span style="color:var(--muted);font-size:11px">— ${cu.phone||''}</span></div>`).join('');
    drop.style.display=cs.length?'block':'none';};
  window.billSetCust=(id,name,phone,pts)=>{customer={id,name,phone,loyalty_points:pts};c.innerHTML=billHTML();};
  window.billGen=async()=>{
    if(!cart.length){toast('Add items first','warn');return;}
    const btn=document.getElementById('gen-btn');btn.disabled=true;btn.textContent='Processing…';
    try{
      const res=await POST('/bills',{customer_id:customer?.id||null,
        patient_name:document.getElementById('patient-name')?.value||'',
        discount_pct:discount,payment_mode:payMode,
        items:cart.map(i=>({drug_id:i.id,tablets_qty:i.qty}))});
      toast(`Bill ${res.bill_no} · ${fmtI(res.total)}`,'success');
      cart=[];customer=null;discount=0;c.innerHTML=billHTML();
    }catch(e){btn.disabled=false;btn.textContent='Generate Bill';}
  };
}

// ── STOCK ENTRY ────────────────────────────────────────────────────────────────
async function renderStockEntry(c) {
  let mode='keyboard', added=[];
  function html(){return `<div class="gap-16 fade-in">
    <h2 style="font-size:18px;font-weight:800">Stock Entry</h2>
    <div class="grid-3">
      ${[['keyboard','⌨️','Fast Type','2 letters → autocomplete'],['camera','📷','Scan Strip','Camera reads batch + expiry'],['challan','📄','Scan Challan','Upload whole invoice']].map(([m,ic,lb,ds])=>`
      <button onclick="setMode('${m}')" style="background:${mode===m?'var(--accent-dim)':'var(--card)'};border:2px solid ${mode===m?'var(--accent)':'var(--border)'};border-radius:12px;padding:14px;cursor:pointer;text-align:left;transition:all .2s">
        <div style="font-size:22px;margin-bottom:6px">${ic}</div>
        <div style="font-weight:800;color:${mode===m?'var(--accent)':'var(--text)'};font-size:13px">${lb}</div>
        <div style="color:var(--muted);font-size:11px;margin-top:2px">${ds}</div>
      </button>`).join('')}
    </div>
    <div id="mode-panel">${modePanel()}</div>
    ${added.length?`<div class="card-sm"><div class="section-title">Added this session (${added.length})</div>
      ${added.map(e=>`<div class="flex-between" style="padding:5px 0;border-bottom:1px solid #1e2d4222;font-size:12px">
        <span style="font-weight:700">${e.n}</span>
        <div class="row"><span class="tag tag-teal">+${e.s} strips</span><span class="tag tag-green">${fmtExp(e.e)}</span></div>
      </div>`).join('')}
    </div>`:''}
  </div>`;}

  function modePanel(){
    if(mode==='keyboard') return `<div class="card">
      <div class="search-wrap"><span class="search-icon">⌨️</span>
        <input class="input" id="stock-s" placeholder="Type drug name…" oninput="stockSearch(this.value)" autocomplete="off">
        <div class="search-drop" id="stock-drop" style="display:none"></div>
      </div>
      <div id="stock-form" style="display:none;margin-top:14px"></div>
    </div>`;
    if(mode==='camera') return `<div class="card" style="text-align:center;padding:32px">
      <div style="font-size:36px;margin-bottom:10px">📷</div>
      <div style="font-weight:800;margin-bottom:4px">Scan Strip</div>
      <div style="color:var(--muted);font-size:12px;margin-bottom:14px">Point camera at strip — Gemini reads drug name, batch & expiry</div>
      <button class="btn btn-primary" onclick="startCameraScan()">Start Camera</button>
      <div id="camera-area" style="margin-top:14px"></div>
    </div>`;
    if(mode==='challan') return `<div class="card">
      <div style="border:2px dashed var(--border);border-radius:10px;padding:32px;text-align:center;cursor:pointer"
        onclick="document.getElementById('challan-file').click()">
        <div style="font-size:36px;margin-bottom:10px">📄</div>
        <div style="font-weight:800;margin-bottom:4px">Upload Invoice Photo</div>
        <div style="color:var(--muted);font-size:12px">JPG · PNG · Printed or handwritten</div>
        <input type="file" id="challan-file" accept="image/*" style="display:none" onchange="handleChallaScan(this.files[0])">
      </div>
      <div id="challan-result" style="margin-top:14px"></div>
    </div>`;
    return '';
  }

  c.innerHTML=html();
  window.setMode=(m)=>{mode=m;c.innerHTML=html();};

  window.stockSearch=async(q)=>{if(q.length<1){document.getElementById('stock-drop').style.display='none';return;}
    const drugs=await GET('/drugs?q='+encodeURIComponent(q));
    const drop=document.getElementById('stock-drop');
    drop.innerHTML=drugs.slice(0,8).map(d=>`<div class="search-item" onclick='stockSel(${JSON.stringify(d).replace(/'/g,"\\'")})'><div style="font-weight:700">${d.name}</div><div style="font-size:11px;color:var(--muted)">${d.brand||''} · ${d.tablets_per_strip||10} tabs/strip</div></div>`).join('');
    drop.style.display=drugs.length?'block':'none';};

  window.stockSel=(drug)=>{
    if(typeof drug==='string') drug=JSON.parse(drug);
    document.getElementById('stock-drop').style.display='none';
    document.getElementById('stock-s').value=drug.name;
    const frm=document.getElementById('stock-form'); frm.style.display='block';
    frm.innerHTML=`<div class="gap-10">
      <div class="alert alert-success">✅ ${drug.name} · ${drug.tablets_per_strip||10} tabs/strip · MRP ₹${drug.mrp_per_strip||0}/strip</div>
      <div class="grid-2">
        <div class="field"><label>Batch No. *</label><input class="input" id="s-batch" placeholder="B24-112"></div>
        <div class="field"><label>Expiry *</label><input class="input" type="month" id="s-exp"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Strips received</label><input class="input" type="number" id="s-strips" value="1" min="1"></div>
        <div class="field"><label>Cost/strip ₹</label><input class="input" type="number" id="s-cost" placeholder="Optional"></div>
      </div>
      <button class="btn btn-primary btn-full" onclick="submitStock(${drug.id},'${drug.name}')">✅ Add to Stock</button>
    </div>`;};

  window.submitStock=async(id,name)=>{
    const batch=document.getElementById('s-batch')?.value?.trim();
    const expiry=document.getElementById('s-exp')?.value;
    const strips=parseInt(document.getElementById('s-strips')?.value||1);
    const cost=parseFloat(document.getElementById('s-cost')?.value||0);
    if(!batch||!expiry){toast('Batch and expiry required','warn');return;}
    if(monthsLeft(expiry)<=0){toast('Expiry is already past','error');return;}
    await POST('/batches',{drug_id:id,batch_no:batch,expiry,strips,cost_per_strip:cost});
    added.push({n:name,s:strips,e:expiry});
    toast('Stock added ✅','success');
    document.getElementById('stock-s').value='';
    document.getElementById('stock-form').style.display='none';
    c.innerHTML=html();};

  window.startCameraScan=async()=>{
    const area=document.getElementById('camera-area');
    area.innerHTML=`<div style="position:relative;margin-top:10px">
      <video id="cam-vid" autoplay playsinline style="width:100%;border-radius:10px;border:1px solid var(--border)"></video>
      <button class="btn btn-primary" style="margin-top:8px;width:100%" onclick="captureStrip()">📸 Capture</button>
      <canvas id="cam-canvas" style="display:none"></canvas>
    </div>`;
    try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      document.getElementById('cam-vid').srcObject=stream;}
    catch(e){area.innerHTML='<div class="alert alert-warn">⚠️ Camera unavailable — use Challan mode to upload a photo</div>';}};

  window.captureStrip=async()=>{
    const vid=document.getElementById('cam-vid'),canvas=document.getElementById('cam-canvas');
    canvas.width=vid.videoWidth;canvas.height=vid.videoHeight;
    canvas.getContext('2d').drawImage(vid,0,0);
    vid.srcObject?.getTracks().forEach(t=>t.stop());
    const b64=canvas.toDataURL('image/jpeg',0.85).split(',')[1];
    const area=document.getElementById('camera-area');
    area.innerHTML='<div class="row" style="justify-content:center;padding:14px"><div class="spinner"></div><span style="color:var(--muted)">Reading with Gemini…</span></div>';
    const res=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image_b64:b64,mime:'image/jpeg',mode:'strip'})}).then(r=>r.json());
    if(!res.ok){area.innerHTML=`<div class="alert alert-warn">⚠️ ${res.error==='no_key'?'No Gemini key set in backend/main.py':res.error}</div>`;return;}
    area.innerHTML='<div class="alert alert-success">✅ Read — verify below</div>';
    const r=res.result;
    const drugs=await GET('/drugs?q='+encodeURIComponent((r.drug_name||'').split(' ')[0]));
    if(drugs[0]){window.stockSel(drugs[0]);setTimeout(()=>{
      const b=document.getElementById('s-batch'),e=document.getElementById('s-exp');
      if(b)b.value=r.batch_no||'';if(e)e.value=r.expiry||'';},100);}
    else area.innerHTML+=`<div class="alert alert-warn" style="margin-top:8px">Drug "${r.drug_name}" not in catalogue</div>`;};

  window.handleChallaScan=async(file)=>{
    if(!file)return;
    const res=document.getElementById('challan-result');
    res.innerHTML='<div class="row" style="justify-content:center;padding:14px"><div class="spinner"></div><span style="color:var(--muted)">Reading with Gemini…</span></div>';
    const b64=await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=err;r.readAsDataURL(file);});
    const scanRes=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image_b64:b64,mime:file.type||'image/jpeg',mode:'challan'})}).then(r=>r.json());
    if(!scanRes.ok){res.innerHTML=`<div class="alert alert-warn">⚠️ ${scanRes.error==='no_key'?'No Gemini key set in backend/main.py':scanRes.error}</div>`;return;}
    const items=scanRes.result;
    res.innerHTML=`<div class="gap-10"><div class="section-title">Gemini found ${items.length} items</div>
      ${items.map((it,i)=>`<div class="card-sm" style="border-color:var(--info)33">
        <div style="font-weight:700;margin-bottom:8px">${it.drug_name||'Unknown'}</div>
        <div class="grid-2" style="gap:8px;margin-bottom:8px">
          <div class="field"><label>Batch</label><input class="input" value="${it.batch_no||''}" id="ch-b-${i}"></div>
          <div class="field"><label>Expiry</label><input class="input" type="month" value="${it.expiry||''}" id="ch-e-${i}"></div>
        </div>
        <div class="field"><label>Strips</label><input class="input" type="number" value="${it.strips||1}" id="ch-s-${i}" min="1"></div>
        <button class="btn btn-primary btn-sm btn-full" style="margin-top:8px" onclick="confirmChall(${i},'${(it.drug_name||'').replace(/'/g,"\\'")}')">✅ Add to Stock</button>
      </div>`).join('')}
    </div>`;};

  window.confirmChall=async(i,name)=>{
    const drugs=await GET('/drugs?q='+encodeURIComponent(name.split(' ')[0]));
    if(!drugs.length){toast('Drug not in catalogue','warn');return;}
    const d=drugs[0];
    const batch=document.getElementById('ch-b-'+i)?.value||'';
    const expiry=document.getElementById('ch-e-'+i)?.value||'';
    const strips=parseInt(document.getElementById('ch-s-'+i)?.value||1);
    await POST('/batches',{drug_id:d.id,batch_no:batch,expiry,strips});
    added.push({n:d.name,s:strips,e:expiry});
    toast(`${d.name} · ${strips} strips added`,'success');
    c.innerHTML=html();};
}

          ${Array.from({length:maxS},(_,i)=>`<div style="height:36px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-size:10px;color:${i===4?'var(--accent)':'var(--muted)'};font-weight:${i===4?700:400}">S${i+1}${i===4?' 👁':''}</div>`).join('')}
        </div>
        ${racks.map(rack=>`<div style="flex:1;min-width:50px;margin-right:4px">
          <div style="height:24px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:${rack.color}">${rack.name}</div>
          ${Array.from({length:maxS},(_,si)=>{
            const shelf='S'+(si+1), key=rack.rack_id+'-'+shelf;
            const cell=dmap[key], inRack=(si+1)<=rack.shelves;
            if(!inRack)return `<div style="height:34px;margin-bottom:3px"></div>`;
            return `<div title="${cell?cell.name+' · '+cell.stock_tablets+' tabs':shelf+' empty'}" style="height:34px;margin-bottom:3px;border-radius:6px;background:${cell?rack.color+'22':'var(--faint)'};border:1px solid ${cell?rack.color+'55':'var(--border)'};display:flex;align-items:center;justify-content:center;cursor:default">
              ${cell?`<div style="font-size:7px;font-weight:700;color:${rack.color};text-align:center;padding:1px;line-height:1.2">${cell.name.split(' ')[0].slice(0,7)}</div>`:''}
            </div>`;}).join('')}
          ${rack.label?`<div style="font-size:8px;color:${rack.color};text-align:center;margin-top:3px">${rack.label}</div>`:''}
        </div>`).join('')}
      </div>
      <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
        ${racks.map(r=>`<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)"><div style="width:8px;height:8px;border-radius:2px;background:${r.color}"></div>${r.name}${r.label?' — '+r.label:''} (${r.shelves}S)</span>`).join('')}
      </div>
    </div>
  </div>`;
}

// ── CUSTOMERS ──────────────────────────────────────────────────────────────────
async function renderCustomers(c) {
  const custs=await GET('/customers');
  c.innerHTML=`<div class="gap-16 fade-in">
    <div class="flex-between"><h2 style="font-size:18px;font-weight:800">Customers · ${custs.length}</h2>
      <button class="btn btn-primary btn-sm" onclick="showAddCustomer()">+ Add</button></div>
    <div class="card" style="padding:0;overflow:auto">
      <table class="tbl"><thead><tr><th>Name</th><th>Phone</th><th>Points</th><th>Joined</th></tr></thead>
        <tbody>${custs.map(cu=>`<tr><td style="font-weight:700">${cu.name}</td><td style="color:var(--muted)">${cu.phone||'—'}</td>
          <td style="color:var(--accent);font-weight:800">${cu.loyalty_points||0}</td>
          <td style="font-size:11px;color:var(--muted)">${cu.created_at?.slice(0,10)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
  window.showAddCustomer=()=>{
    const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`
    <div class="modal"><div class="modal-title">Add Customer</div>
      <div class="gap-14">
        <div class="field"><label>Name *</label><input class="input" id="ac-n" placeholder="Full name"></div>
        <div class="field"><label>Phone</label><input class="input" id="ac-p"></div>
        <div style="display:flex;gap:10px"><button class="btn btn-outline" style="flex:1" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" style="flex:1" onclick="saveCustomer()">Add</button></div>
      </div>
    </div>`;document.body.appendChild(m);};
  window.saveCustomer=async()=>{
    const name=document.getElementById('ac-n')?.value?.trim();
    if(!name){toast('Name required','warn');return;}
    await POST('/customers',{name,phone:document.getElementById('ac-p')?.value||''});
    document.querySelector('.modal-overlay')?.remove();toast('Added','success');navigate('customers');};
}

// ── SUPPLIERS ──────────────────────────────────────────────────────────────────
async function renderSuppliers(c) {
  const sups=await GET('/suppliers');
  c.innerHTML=`<div class="gap-16 fade-in">
    <div class="flex-between"><h2 style="font-size:18px;font-weight:800">Suppliers</h2>
      <button class="btn btn-primary btn-sm" onclick="showAddSupplier()">+ Add</button></div>
    ${sups.length===0?'<div class="card" style="text-align:center;padding:40px;color:var(--muted)">No suppliers yet</div>':`<div class="gap-10">${sups.map(s=>`<div class="card flex-between">
      <div><div style="font-weight:800;font-size:14px;margin-bottom:3px">${s.name}</div>
        <div style="color:var(--muted);font-size:12px">${s.contact||'—'} · ${s.phone||'—'} · ${s.gstin||'—'}</div></div>
      <div style="text-align:right"><div style="font-size:16px;font-weight:900;color:${s.due>0?'var(--warn)':'var(--green)'}">₹${(s.due||0).toLocaleString('en-IN')}</div>
        <div style="font-size:10px;color:var(--muted)">due</div></div>
    </div>`).join('')}</div>`}
  </div>`;
  window.showAddSupplier=()=>{
    const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`
    <div class="modal"><div class="modal-title">Add Supplier</div>
      <div class="gap-14">
        <div class="field"><label>Company *</label><input class="input" id="as-n" placeholder="Supplier company"></div>
        <div class="grid-2"><div class="field"><label>Contact Person</label><input class="input" id="as-c"></div>
          <div class="field"><label>Phone</label><input class="input" id="as-p"></div></div>
        <div class="field"><label>GSTIN</label><input class="input" id="as-g"></div>
        <div style="display:flex;gap:10px"><button class="btn btn-outline" style="flex:1" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" style="flex:1" onclick="saveSupplier()">Add</button></div>
      </div>
    </div>`;document.body.appendChild(m);};
  window.saveSupplier=async()=>{
    const name=document.getElementById('as-n')?.value?.trim();
    if(!name){toast('Name required','warn');return;}
    await POST('/suppliers',{name,contact:document.getElementById('as-c')?.value||'',phone:document.getElementById('as-p')?.value||'',gstin:document.getElementById('as-g')?.value||''});
    document.querySelector('.modal-overlay')?.remove();toast('Added','success');navigate('suppliers');};
}

// ── REPORTS ────────────────────────────────────────────────────────────────────
async function renderReports(c) {
  const thisMonth=new Date().toISOString().slice(0,7);
  c.innerHTML=`<div class="gap-16 fade-in">
    <h2 style="font-size:18px;font-weight:800">Reports</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
      ${[{ic:'🧾',n:'GSTR-1 Monthly',d:'All taxable bills for GST return',id:'gstr1',c:'var(--accent)'},
         {ic:'📦',n:'Expiry Report',d:'Expired and near-expiry batches',id:'expiry',c:'var(--warn)'},
         {ic:'📋',n:'Stock Report',d:'Current stock at tablet level',id:'stock',c:'var(--info)'}].map(r=>`
      <div class="card" style="cursor:pointer;transition:all .2s" onclick="runReport('${r.id}')"
        onmouseenter="this.style.borderColor='${r.c}44';this.style.transform='translateY(-2px)'"
        onmouseleave="this.style.borderColor='var(--border)';this.style.transform='none'">
        <div style="font-size:26px;margin-bottom:8px">${r.ic}</div>
        <div style="font-weight:800;font-size:13px;margin-bottom:4px">${r.n}</div>
        <div style="color:var(--muted);font-size:11px">${r.d}</div>
      </div>`).join('')}
    </div>
    <div id="report-out"></div>
  </div>`;
  window.runReport=async(id)=>{
    const out=document.getElementById('report-out');
    out.innerHTML='<div class="loading-center"><div class="spinner"></div></div>';
    await new Promise(r=>setTimeout(r,500));
    if(id==='gstr1'){
      const data=await GET('/reports/gstr1?month='+thisMonth);
      out.innerHTML=`<div class="card"><div class="section-title">GSTR-1 · ${thisMonth}</div>
        <table class="tbl"><thead><tr><th>Bill</th><th>Date</th><th>Customer</th><th>Taxable</th><th>GST</th><th>Total</th></tr></thead>
        <tbody>${data.map(r=>`<tr><td style="font-family:monospace;font-size:11px">${r.bill_no}</td>
          <td style="font-size:11px">${r.created_at?.slice(0,10)}</td><td>${r.customer||'Walk-in'}</td>
          <td>${fmt(r.taxable)}</td><td>${fmt(r.gst_amt)}</td>
          <td style="font-weight:700;color:var(--accent)">${fmt(r.total)}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else if(id==='expiry'){
      const data=await GET('/reports/expiry');
      out.innerHTML=`<div class="card"><div class="section-title">Expiry Report</div>
        <table class="tbl"><thead><tr><th>Drug</th><th>Batch</th><th>Expiry</th><th>Strips</th><th>Location</th><th>Status</th></tr></thead>
        <tbody>${data.map(r=>`<tr><td style="font-weight:700">${r.name}</td>
          <td style="font-family:monospace;font-size:11px">${r.batch_no}</td>
          <td style="color:${expiryColor(r.expiry)};font-weight:700">${fmtExp(r.expiry)}</td>
          <td>${r.full_strips}</td><td style="color:var(--accent)">${r.rack}-${r.shelf}</td>
          <td>${monthsLeft(r.expiry)<=0?'<span class="tag tag-red">Expired</span>':monthsLeft(r.expiry)<=3?'<span class="tag tag-amber">Soon</span>':'<span class="tag tag-green">OK</span>'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    }
  };
}

// ── SETTINGS ───────────────────────────────────────────────────────────────────
async function renderSettings(c) {
  const cfg=await GET('/config');
  c.innerHTML=`<div class="gap-16 fade-in">
    <h2 style="font-size:18px;font-weight:800">Settings</h2>
    <div class="card">
      <div class="section-title">Shop Details</div>
      <div class="gap-14">
        <div class="grid-2">
          <div class="field"><label>Shop Name</label><input class="input" id="ss-n" value="${cfg.name||''}"></div>
          <div class="field"><label>Owner</label><input class="input" id="ss-o" value="${cfg.owner||''}"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>GSTIN</label><input class="input" id="ss-g" value="${cfg.gstin||''}"></div>
          <div class="field"><label>Drug Licence</label><input class="input" id="ss-l" value="${cfg.licence||''}"></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="saveSettings()">Save Changes</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Account</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)">
        <span>Email: <b style="color:var(--text)">${APP.user.email}</b></span>
        <span>Shop: <b style="color:var(--text)">${APP.user.shop_name}</b></span>
        ${APP.user.access_expiry?`<span>Access until: <b style="color:${expiryColor(APP.user.access_expiry)}">${APP.user.access_expiry}</b></span>`:'<span>Access: <b style="color:var(--green)">No expiry</b></span>'}
      </div>
    </div>
  </div>`;
  window.saveSettings=async()=>{
    await POST('/config',{name:document.getElementById('ss-n').value,owner:document.getElementById('ss-o').value,
      gstin:document.getElementById('ss-g').value,licence:document.getElementById('ss-l').value,
      strategy:cfg.strategy||'alpha',fefo:true,top_up_tray:true,print_tray_label:true,
      schedule_warning:true,require_batch_on_sale:true,low_stock_reorder:true,broken_strip_alert:2,expiry_warn_months:3});
    toast('Saved','success');};
}

// ── Boot ───────────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
