name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v10-${{ hashFiles('buildozer.spec') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize and Seed Database
        env:
          PYTHONPATH: .
        run: |
          python -c "from backend.database import init_db; init_db()"

      - name: Auto-increment version code
        run: |
          sed -i -E 's/version = ([0-9]+\.[0-9]+\.[0-9]+)/version = \1.${{ github.run_number }}/g' buildozer.spec
          sed -i 's/android.private_storage = True/android.private_storage = True\nandroid.numeric_version = ${{ github.run_number }}/g' buildozer.spec

      - name: Generate and Commit Debug Keystore if missing
        run: |
          mkdir -p signing
          if [ ! -f signing/debug.keystore ]; then
            echo "Generating new persistent debug keystore..."
            keytool -genkey -v -keystore signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PharmaPro, OU=Development, O=PharmaPro, L=Bangalore, S=Karnataka, C=IN"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "chore: add auto-generated persistent debug keystore [skip ci]"
            git push
          else
            echo "Persistent debug keystore exists."
          fi

      - name: Configure Buildozer Keystore
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK with Buildozer
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: '3.11'
          buildozer-cmd: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaPro-Android-APK
          path: bin/*.apk
          if-no-files-found: error
