name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v10-${{ hashFiles('buildozer.spec') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize and Seed Database
        env:
          PYTHONPATH: .
        run: |
          python -c "from backend.database import init_db; init_db()"

      - name: Auto-increment version code
        run: |
          sed -i -E 's/version = ([0-9]+\.[0-9]+\.[0-9]+)/version = \1.${{ github.run_number }}/g' buildozer.spec
          sed -i 's/android.private_storage = True/android.private_storage = True\nandroid.numeric_version = ${{ github.run_number }}/g' buildozer.spec

      - name: Restore Persistent Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing ~/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/pharmapro-release.keystore
          cp signing/pharmapro-release.keystore ~/.android/debug.keystore
          echo "Keystore restored from secret ($(wc -c < signing/pharmapro-release.keystore) bytes)"

      - name: Build APK with Buildozer
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: '3.11'
          buildozer-cmd: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaPro-Android-APK
          path: bin/*.apk
          if-no-files-found: error
